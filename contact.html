<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ติดต่อครู · KruNoiNa Math</title>
<meta name="description" content="ช่องทางติดต่อครูจิราภรณ์ คำแสนราช (ครูน้อยหน่า) โรงเรียนบ้านสำโรง (คุรุประชาสามัคคี)">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&family=Poppins:wght@500;600;700&display=swap">
<link rel="stylesheet" href="theme.css">
<style>
  .ct-grid{display:grid; grid-template-columns:1.1fr .9fr; gap:22px; align-items:start}
  .ct-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-l); padding:26px}
  .ct-list{display:grid; gap:10px; margin-top:18px}
  .ct-list a{
    display:flex; align-items:center; gap:14px; padding:14px 18px; border-radius:14px;
    border:1px solid var(--line); background:var(--surface-2); transition:border-color .15s ease, transform .15s ease;
  }
  .ct-list a:hover{border-color:var(--royal); transform:translateX(3px)}
  .ct-list .ic{width:42px; height:42px; border-radius:12px; display:grid; place-items:center; font-size:20px; background:var(--sky); flex:0 0 auto}
  .ct-list b{display:block; font-size:15.5px}
  .ct-list small{font-size:13px; color:var(--muted)}
  .ct-where{display:grid; gap:12px; margin-top:16px}
  .ct-where div{display:grid; grid-template-columns:28px 1fr; gap:12px; font-size:15px; align-items:start}
  .ct-where .i{font-size:17px}
  @media (max-width:900px){ .ct-grid{grid-template-columns:1fr} }
</style>
</head>
<body>

<header class="site"></header>

<main>
  <div class="page-head">
    <div class="wrap pop pop-1">
      <p class="crumb"><a href="index.html">หน้าหลัก</a> &#8250; ติดต่อครู</p>
      <span class="eyebrow">Contact</span>
      <h1>ติดต่อครูน้อยหน่า</h1>
      <p class="sub">มีคำถามเกี่ยวกับบทเรียน ต้องการเอกสารเพิ่มเติม อยากขอไฟล์งาน หรือมีข้อเสนอแนะเกี่ยวกับเว็บไซต์ ติดต่อได้ตามช่องทางด้านล่างค่ะ</p>
    </div>
  </div>

  <section>
    <div class="wrap ct-grid">
      <div class="ct-card pop pop-1">
        <h2 style="font-size:20px">ช่องทางติดต่อ</h2>
        <p style="font-size:14.5px;color:var(--muted);margin-top:6px">เลือกช่องทางที่สะดวกที่สุด ครูจะตอบกลับโดยเร็วที่สุดค่ะ</p>
        <div class="ct-list" id="ctList"></div>
      </div>

      <div class="ct-card pop pop-2">
        <h2 style="font-size:20px">สถานที่ทำงาน</h2>
        <div class="ct-where" id="ctWhere"></div>
        <div class="cta" style="margin-top:22px">
          <a class="btn btn-ghost" href="about.html">ดูประวัติและผลงาน →</a>
        </div>
      </div>
    </div>
  </section>
</main>

<footer class="site"></footer>

<script type="module">
import { boot, one, esc } from "./app.js";

(async () => {
  const site = await boot();
  const t = await one("teacher");

  const chans = [
    { k:"contactEmail",    ic:"✉️", label:"อีเมล",            sub:"ส่งคำถามหรือขอเอกสารเพิ่มเติม", pre:"mailto:" },
    { k:"contactLine",     ic:"💬", label:"LINE Official",     sub:"สอบถามแบบรวดเร็ว",             pre:"" },
    { k:"contactYoutube",  ic:"▶️", label:"ช่อง YouTube",      sub:"คลิปบทเรียนและเฉลยโจทย์",       pre:"" },
    { k:"contactFacebook", ic:"📘", label:"เพจ Facebook",      sub:"ข่าวสารและกิจกรรมของครู",       pre:"" }
  ].filter(c => site[c.k]);

  document.getElementById("ctList").innerHTML = chans.length
    ? chans.map(c => `<a href="${esc(c.pre + site[c.k])}" target="_blank" rel="noopener">
        <span class="ic">${c.ic}</span><span><b>${c.label}</b><small>${c.sub}</small></span></a>`).join("")
    : `<div class="empty"><div class="ic">📭</div><b>ยังไม่ได้ใส่ช่องทางติดต่อ</b>
         <p>เพิ่มได้ที่ <a href="admin.html" style="color:var(--royal);font-weight:600">ระบบจัดการเว็บไซต์</a> → ตั้งค่าเว็บไซต์</p></div>`;

  document.getElementById("ctWhere").innerHTML = [
    ["👩‍🏫", `${t.name} (${t.nickname})`],
    ["🎓", t.position],
    ["🏫", t.school],
    ["📍", t.address],
    ["🏛️", t.affiliation]
  ].filter(r => r[1]).map(r =>
    `<div><span class="i">${r[0]}</span><span>${esc(r[1])}</span></div>`).join("");
})();
</script>
</body>
</html>
