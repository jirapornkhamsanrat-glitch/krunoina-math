<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>แจกไฟล์ · KruNoiNa Math</title>
<meta name="description" content="แผนการจัดการเรียนรู้ ใบงาน สื่อการสอน และข้อสอบคณิตศาสตร์ ให้เพื่อนครูและนักเรียนดาวน์โหลดฟรี">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&family=Poppins:wght@500;600;700&display=swap">
<link rel="stylesheet" href="theme.css">
</head>
<body>

<header class="site"></header>

<main>
  <div class="page-head">
    <div class="wrap pop pop-1">
      <p class="crumb"><a href="index.html">หน้าหลัก</a> &#8250; แจกไฟล์</p>
      <span class="eyebrow">Free downloads</span>
      <h1>แจกไฟล์งาน</h1>
      <p class="sub">แผนการจัดการเรียนรู้ ใบงาน สื่อการสอน และข้อสอบพร้อมเฉลย ที่ครูน้อยหน่าจัดทำขึ้น เปิดให้เพื่อนครูและนักเรียนดาวน์โหลดไปใช้ได้ฟรี</p>
    </div>
  </div>

  <section>
    <div class="wrap">
      <div class="dl-filters pop pop-1" id="filters"></div>
      <div class="dl-grid stagger" id="grid"></div>
    </div>
  </section>
</main>

<footer class="site"></footer>

<script type="module">
import { boot, list, esc, lightbox, requestDownload } from "./app.js";

let ITEMS = [], cat = "ทั้งหมด";

(async () => {
  await boot();
  ITEMS = await list("downloads");
  render();
})();

function render(){
  const grid = document.getElementById("grid");
  const fw   = document.getElementById("filters");

  if (!ITEMS.length){
    fw.innerHTML = "";
    grid.style.display = "block";
    grid.innerHTML = `
      <div class="empty">
        <div class="ic">📦</div>
        <b>ยังไม่มีไฟล์ให้ดาวน์โหลด</b>
        <p>คุณครูสามารถเพิ่มไฟล์ได้ที่ <a href="admin.html" style="color:var(--royal);font-weight:600">ระบบจัดการเว็บไซต์</a><br>
           เมนู “แจกไฟล์” → เพิ่มรายการใหม่</p>
      </div>`;
    return;
  }
  grid.style.display = "";

  const cats = ["ทั้งหมด", ...new Set(ITEMS.map(i => i.category).filter(Boolean))];
  fw.innerHTML = cats.map(c =>
    `<button type="button" data-c="${esc(c)}" aria-pressed="${c===cat}">${esc(c)}</button>`).join("");
  fw.onclick = e => {
    const b = e.target.closest("button"); if (!b) return;
    cat = b.dataset.c; render();
  };

  const show = cat === "ทั้งหมด" ? ITEMS : ITEMS.filter(i => i.category === cat);

  grid.innerHTML = show.map((it, idx) => {
    const imgs = (it.images || []).filter(Boolean);
    const cover = imgs[0]
      ? `<img src="${imgs[0]}" alt="ตัวอย่าง ${esc(it.title)}" loading="lazy">`
      : `<span class="ph">📄</span>`;
    const more = imgs.length > 1 ? `<span class="n">${imgs.length} รูป</span>` : "";
    const thumbs = imgs.length > 1
      ? `<div class="dl-thumbs">${imgs.slice(1,6).map((s,k) =>
          `<img src="${s}" alt="" data-i="${idx}" data-k="${k+1}" loading="lazy">`).join("")}</div>`
      : "";
    return `<article class="dl-card">
      <div class="dl-cover" data-i="${idx}" data-k="0">${cover}${more}</div>
      ${thumbs}
      <div class="dl-body">
        ${it.category ? `<span class="cat">${esc(it.category)}</span>` : ""}
        <h3>${esc(it.title)}</h3>
        <p>${esc(it.detail || "")}</p>
        <div class="dl-meta">
          ${it.date ? `<span>📅 ${esc(it.date)}</span>` : ""}
          ${it.fileType ? `<span>🗂️ ${esc(it.fileType)}</span>` : ""}
        </div>
        <button class="btn btn-gold dl-btn" type="button" data-i="${idx}">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M12 3v12m0 0 4.5-4.5M12 15l-4.5-4.5M4 19h16"/></svg>
          ดาวน์โหลดไฟล์
        </button>
      </div>
    </article>`;
  }).join("");

  // ขยายรูป
  grid.onclick = e => {
    const dl = e.target.closest(".dl-btn");
    if (dl){
      const it = show[+dl.dataset.i];
      return requestDownload(it.fileUrl, it.title);
    }
    const im = e.target.closest("[data-k]");
    if (im){
      const it = show[+im.dataset.i];
      const imgs = (it.images || []).filter(Boolean)
        .map(s => ({ src:s, cap:it.title }));
      lightbox(imgs, +im.dataset.k);
    }
  };
}
</script>
</body>
</html>
